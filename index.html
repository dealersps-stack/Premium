            } else if (pageName === 'studio desain') {

            } else if (pageName === 'generator prompt ai') {

            } else if (pageName === 'template') {

        };

        window.simulateUpload = function() {
            closeModal();
            showNotification("Foto motor berhasil diunggah!");
            navigatePage('studio desain');
        };

        window.generateAIPrompt = function() {
            const motor = document.getElementById('ai-motor').value;
            const tema = document.getElementById('ai-tema').value;
            const promptBox = document.getElementById('ai-result-box');
            const promptText = document.getElementById('ai-prompt-text');

            promptText.innerText = `Buat poster promosi motor Honda ${motor} dengan tema ${tema} di jalan perkotaan modern saat senja, pencahayaan sinematik dramatis, teks tajam kualitas tinggi, gaya futuristik komersial.`;
            promptBox.classList.remove('hidden');
            showNotification("Prompt AI berhasil dibuat!");
        };

        window.salinPrompt = function() {
            const text = document.getElementById('ai-prompt-text').innerText;
            navigator.clipboard.writeText(text);
            showNotification("Prompt berhasil disalin ke clipboard!");
        };

        window.simpanProyekBaru = function() {
            const judul = document.getElementById('input-judul-poster').value;
            state.projects.unshift({
                id: Date.now(),
                title: judul,
                category: '9:16',
                time: 'Baru saja',
                image: 'https://images.unsplash.com/photo-1558980664-3a031cf67ea8?auto=format&fit=crop&w=500&q=80'
            });
            showNotification("Proyek berhasil disimpan!");
            navigatePage('proyek saya');
        };

        window.hapusProyek = function(id) {
            state.projects = state.projects.filter(p => p.id !== id);
            renderProyekSaya();
            showNotification("Proyek dihapus.");
        };

        window.showNotification = function(message) {
            const toast = document.createElement('div');
            toast.className = 'fixed bottom-5 right-5 bg-hondaRed text-white text-xs font-bold px-4 py-3 rounded-xl shadow-2xl z-50 animate-bounce';
            toast.innerText = message;
            document.body.appendChild(toast);
            setTimeout(() => toast.remove(), 3000);
        };

        // --- 6. EVENT LISTENER NAVBAR ---
        navLinks.forEach(link => {
            link.addEventListener('click', (e) => {
                e.preventDefault();
                const text = link.querySelector('span')?.innerText.toLowerCase() || '';
                if (text) navigatePage(text);
            });
        });

        // Tombol Upgrade Premium di Sidebar
        const upgradeBtn = document.querySelector('aside button');
        if (upgradeBtn) {
            upgradeBtn.addEventListener('click', () => {
                showNotification("Anda sudah menikmati akses Honda Creator Premium!");
            });
        }
    });
</script>
